# =============================================================================
# Pipeline de Integración Continua (CI) - acm_ecommerce_java_avanzado
# -----------------------------------------------------------------------------
# Flujo:  build ──► test ──┐
#                          ├──► docker-build ──► security-scan (Trivy) ──► publish (GHCR)
#         codeql ──────────┘
#
# Apartados de evaluación implementados:
#   1. Seguridad integrada: GitHub CodeQL (SAST) + Trivy (escaneo de la imagen)
#   2. Etiquetado semántico: short-SHA, número de PR, versión SemVer (vX.Y.Z) y latest
# =============================================================================
name: CI - Build App

on:
  # Requisito principal: ejecutar al abrir/actualizar un Pull Request hacia main
  pull_request:
    branches: [ "main", "master" ]
  # Extra: al publicar un tag vX.Y.Z se genera la imagen con la versión semántica
  push:
    tags: [ "v*.*.*" ]
  # Extra: permite lanzarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# Cancela ejecuciones viejas del mismo PR/rama cuando llega un commit nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principio de mínimo privilegio: por defecto solo lectura.
# Cada job amplía únicamente los permisos que necesita.
permissions:
  contents: read

env:
  JAVA_VERSION: "25"            # Debe coincidir con el toolchain de build.gradle
  JAVA_DISTRIBUTION: "temurin"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: BUILD - compila y genera el JAR (sin ejecutar pruebas)
  # ---------------------------------------------------------------------------
  build:
    name: Build (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK ${{ env.JAVA_VERSION }} con caché de Gradle
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle               # Caché de dependencias de Gradle

      - name: Dar permisos de ejecución al wrapper
        run: chmod +x ./gradlew

      - name: Compilar y empaquetar (sin tests)
        run: ./gradlew clean assemble --no-daemon

      - name: Subir JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*-SNAPSHOT.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 2: TEST - ejecuta las pruebas contra un PostgreSQL real.
  # Las credenciales llegan desde GitHub Secrets (nunca desde el repo).
  # ---------------------------------------------------------------------------
  test:
    name: Test (JUnit + PostgreSQL)
    runs-on: ubuntu-latest
    needs: build                      # Solo corre si el build fue exitoso
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK ${{ env.JAVA_VERSION }} con caché de Gradle
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Dar permisos de ejecución al wrapper
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas
        env:
          # Sobrescriben application.yaml; los valores vienen de Secrets
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: ./gradlew test --no-daemon

      - name: Publicar reporte de pruebas
        if: always()                  # También si fallan, para poder depurar
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 3: CODEQL - análisis estático de seguridad (SAST) del código Java.
  # Los hallazgos aparecen en la pestaña Security > Code scanning.
  # ---------------------------------------------------------------------------
  codeql:
    name: Seguridad - CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write          # Necesario para subir resultados a Security
      actions: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none            # Analiza el código fuente sin compilar
          queries: security-extended  # Reglas de seguridad ampliadas

      - name: Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  # ---------------------------------------------------------------------------
  # JOB 4: DOCKER BUILD - construye la imagen (aún NO la publica).
  # Solo corre si las pruebas Y CodeQL fueron exitosos.
  # Aquí se calculan las etiquetas semánticas.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker - Build de imagen
    runs-on: ubuntu-latest
    needs: [ test, codeql ]
    timeout-minutes: 15
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Descargar el JAR generado en el job build
        uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: build/libs

      # Etiquetado semántico:
      #   sha-<7 chars>  -> siempre (permite rollback a un commit exacto)
      #   pr-<número>    -> en Pull Requests
      #   1.0.3 / 1.0    -> al hacer push de un tag v1.0.3
      #   latest         -> solo al publicar una versión (tag vX.Y.Z)
      - name: Calcular etiquetas (metadata)
        id: meta
        uses: docker/metadata-action@v5
        env:
          # En PRs usa el SHA del último commit de la rama (no el merge commit)
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen y exportarla como .tar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # JOB 5: SECURITY SCAN - Trivy escanea la imagen ANTES de publicarla.
  # Falla el pipeline si encuentra vulnerabilidades CRÍTICAS con parche.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Seguridad - Trivy (imagen)
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Reporte Trivy en tabla (visible en el log)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Reporte Trivy en SARIF (pestaña Security)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Subir resultados de Trivy a GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Quality gate - bloquear si hay vulnerabilidades CRÍTICAS
        uses: aquasecurity/trivy-action@0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # ---------------------------------------------------------------------------
  # JOB 6: PUBLISH - publica la imagen escaneada en GitHub Container Registry
  # ---------------------------------------------------------------------------
  publish:
    name: Docker - Publicar en GHCR
    runs-on: ubuntu-latest
    needs: [ docker-build, security-scan ]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write                 # Requerido para escribir en GHCR
    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Cargar imagen en Docker
        run: docker load --input ${{ runner.temp }}/image.tar

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar todas las etiquetas
        env:
          TAGS: ${{ needs.docker-build.outputs.tags }}
        run: |
          echo "Publicando etiquetas:"
          for tag in $TAGS; do
            echo "  -> $tag"
            docker push "$tag"
          done

      - name: Resumen de la publicación
        env:
          TAGS: ${{ needs.docker-build.outputs.tags }}
        run: |
          {
            echo "## 🐳 Imagen publicada en GHCR"
            echo ""
            echo "| Etiqueta |"
            echo "|---|"
            for tag in $TAGS; do echo "| \`$tag\` |"; done
            echo ""
            echo "Rollback: \`docker pull <imagen>:sha-<commit>\`"
          } >> "$GITHUB_STEP_SUMMARY"
